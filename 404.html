<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sitio en mantenimiento</title>
<style>
  :root{
    --bg:#0B1220;
    --bg2:#131C2E;
    --accent:#29B6F6;
    --text:#F4F6FA;
    --muted:#8B97AD;
    color-scheme: dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg) 70%);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100%;
    padding: max(20px, env(safe-area-inset-top)) 24px max(48px, env(safe-area-inset-bottom));
    text-align:center;
    overflow-x:hidden;
  }
  .wrap{ max-width:640px; width:100%; margin:auto; }

  .gear{
    width:120px; height:120px; margin:0 auto 32px;
    animation: spin 9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .gear{animation:none;} }
  .gear circle{fill:none; stroke:var(--accent); stroke-width:3; opacity:0.5;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  h1{
    font-size:clamp(28px, 5vw, 40px);
    font-weight:700;
    line-height:1.2;
    margin-bottom:16px;
  }
  p.sub{
    font-size:clamp(15px,2.4vw,18px);
    color:var(--muted);
    line-height:1.6;
    max-width:480px;
    margin:0 auto 32px;
  }

  .bar-track{
    width:100%; max-width:360px; height:8px; border-radius:6px;
    background:rgba(255,255,255,0.08);
    margin:0 auto 8px; overflow:hidden;
  }
  .bar-fill{
    height:100%; width:70%; border-radius:6px;
    background:linear-gradient(90deg, var(--accent), #0D6EFD);
  }
  .bar-label{ font-size:13px; color:var(--muted); margin-bottom:40px; }

  .contact{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
    margin-bottom:28px;
  }
  .contact a{
    color:var(--text); text-decoration:none; font-size:14px;
    border:1px solid rgba(255,255,255,0.15); padding:10px 18px;
    border-radius:999px; transition:border-color .2s;
  }
  .contact a:hover{ border-color:var(--accent); }

  footer{ font-size:13px; color:var(--muted); margin-top:20px; }
  footer strong{ color:var(--text); }
</style>
</head>
<body>
  <div class="wrap">

    <svg class="gear" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42"/>
      <circle cx="50" cy="50" r="30" stroke-dasharray="6 6"/>
    </svg>

    <h1>Estamos mejorando este Sitio Web</h1>
    <p class="sub">
      Estamos trabajando para ofrecerte una mejor experiencia.
      Volveremos a estar en línea muy pronto — Gracias por tu paciencia.
    </p>

    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="bar-label">Trabajo en progreso</div>

    <div class="contact">
      <a href="mailto:techsolutions.cuba@gmail.com">✉ techsolutions.cuba@gmail.com</a>
      <a href="https://wa.me/5358250828">📱 WhatsApp</a>
    </div>

    <footer>
      <strong>Equipo de diseño web - TechSolutions Cuba</strong>.
    </footer>
    <div class="bar-label">Vuelva pronto</div>
  </div>
</body>
</html>
